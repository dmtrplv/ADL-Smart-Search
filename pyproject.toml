[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".venv",
  "dist",
  "data",
  "models",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["adl_smart_search"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
